[package]
name = "classifai-desktop"
description = "ClassifAI Studio: classify and label data with decision models and LLMs, and compare them"
authors = ["Jonas Weinert"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "classifai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
classifai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
csv = "1"
uuid = { version = "1", features = ["v4"] }
